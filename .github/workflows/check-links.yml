name: Check links

# Every Monday, and whenever you press "Run workflow": visit every material's link and report the broken
# ones in a single issue. The issue updates itself and closes when all links are fine.
# In a public repository GitHub switches scheduled workflows off after 60 days without repository activity.
# If that happens, turn this workflow back on in the Actions tab (see RUNBOOK.md).
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: check-links
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Visit every link
        id: check
        run: node scripts/check-links.mjs --report-file "$RUNNER_TEMP/report.md"
      - name: Open or update the report issue
        if: steps.check.outputs.status == 'problems'
        run: |
          gh label create link-check --description "Weekly link check report" --color fbca04 --force
          existing=$(gh issue list --label link-check --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file "$RUNNER_TEMP/report.md"
          else
            gh issue create --title "Link check: some links need attention" --label link-check --body-file "$RUNNER_TEMP/report.md"
          fi
      - name: Close the report when everything is fine
        if: steps.check.outputs.status == 'ok'
        run: |
          existing=$(gh issue list --label link-check --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "All links checked on $(date -u +%F) are fine, so this issue is closed."
            gh issue close "$existing" --reason completed
          fi
