name: Add submission automatically

# Every new submission issue is automatically added to the catalog and published.
on:
  issues:
    types: [opened]

permissions:
  contents: write # commit the new catalog entry
  issues: write   # comment on, relabel and close the issue
  actions: write  # start the deploy (a push made by this workflow does not start it on its own)

concurrency:
  group: catalog-write
  cancel-in-progress: false

jobs:
  add:
    if: contains(github.event.issue.labels.*.name, 'submission') && github.event.issue.state == 'open' && !github.event.issue.pull_request
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The issue text is untrusted. It is read from the event file by the script and never placed in a shell command.
      - name: Build the catalog entry from the issue
        id: add
        run: node scripts/add-from-issue.mjs --event "$GITHUB_EVENT_PATH" --soft --comment-file "$RUNNER_TEMP/comment.md"
      - name: Explain what needs fixing
        if: steps.add.outputs.status == 'problems'
        run: |
          gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/comment.md"
      - name: Publish the entry
        if: steps.add.outputs.status == 'ok'
        env:
          ENTRY_ID: ${{ steps.add.outputs.id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/materials.json
          git commit -m "Add material $ENTRY_ID (from issue #$ISSUE_NUMBER)"
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run deploy.yml --ref main
          gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/comment.md"
          gh issue close "$ISSUE_NUMBER" --reason completed
      - name: Report a crash
        if: failure()
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "The helper stopped unexpectedly. Details: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
